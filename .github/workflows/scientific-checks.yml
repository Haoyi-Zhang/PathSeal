name: Finite campaign
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  finite-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce the finite semantics, certificates, and campaign
        shell: bash
        run: |
          set -euo pipefail
          python -B run_all.py 2>&1 | tee "$RUNNER_TEMP/campaign.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: campaign-results
          path: |
            results/
            examples/
            ${{ runner.temp }}/campaign.log
          if-no-files-found: error
          retention-days: 14
